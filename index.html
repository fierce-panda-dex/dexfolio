<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dexfolio · National Pokédex</title>
<style>
:root{--bg:#050706;--panel:#101512;--green:#168447;--green2:#20a45a;--text:#f4f7f4;--muted:#a7b2aa;--line:#26352b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 18px 18px;max-width:1200px;margin:auto}h1{font-size:clamp(28px,5vw,42px);margin:0;font-weight:800;letter-spacing:-1.5px}header p{color:var(--muted);margin:4px 0 18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select,.toolbar button{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;background:#111713;color:var(--text)}
.toolbar input{flex:1;min-width:180px}.toolbar button,.green{background:var(--green);border-color:var(--green);font-weight:650;cursor:pointer}.toolbar button:hover,.green:hover{background:var(--green2)}
main{max-width:1200px;margin:auto;padding:0 18px 30px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);margin:16px 0}.stats strong{color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slot{background:#fff;color:#172019;border-radius:12px;min-height:190px;padding:10px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 #d8ded9;overflow:hidden}
.num{position:absolute;top:8px;left:9px;font-size:11px;color:#778078;font-weight:700}.sprite{height:82px;width:100%;object-fit:contain;margin:8px 0 2px}.name{font-size:13px;font-weight:750;text-align:center;text-transform:capitalize;min-height:20px}.value{width:100%;margin-top:8px;border:1px solid #dce2dd;border-radius:7px;padding:6px 7px;font-size:12px;color:#25352a;background:#fff}
.slot .status{font-size:10px;color:#7c887f;margin-top:4px}
.slot.owned{outline:2px solid #168447;outline-offset:-2px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:20px 0}.pager button{background:var(--green);border:0;color:white;border-radius:9px;padding:10px 15px;font-weight:700}.pager button:disabled{opacity:.35}.pager span{color:var(--muted)}
footer{max-width:1200px;margin:auto;padding:0 18px 28px;color:#758078;font-size:12px}
@media(max-width:600px){header{padding:18px 12px 14px}main{padding:0 12px 24px}.grid{gap:7px}.slot{min-height:155px;padding:7px;border-radius:9px}.sprite{height:65px}.name{font-size:11px}.value{font-size:10px;padding:5px 3px}.stats{font-size:12px}}
</style></head><body>
<header><h1>dexfolio</h1><p>National Pokédex · 1,024 slots</p>
<div class="toolbar"><input id="search" placeholder="Search Pokémon…" autocomplete="off"><select id="filter"><option value="all">All Pokémon</option><option value="owned">Owned</option><option value="missing">Missing</option></select><button id="backup">Export backup</button><button id="restore">Import backup</button><input id="file" type="file" accept="application/json" hidden></div></header>
<main><div class="stats"><span>Page <strong id="pageNum">1</strong> / 64 · 16 slots per page</span><span>Owned <strong id="ownedCount">0</strong> / 1,024 · Collection value <strong id="total">NOK 0</strong></span></div>
<div id="grid" class="grid"></div><div class="pager"><button id="prev">← Prev</button><span id="pagerLabel">Page 1 / 64</span><button id="next">Next →</button></div></main>
<footer>Prices are manually entered estimates in NOK. Your binder is saved in this browser; export a backup regularly.</footer>
<script>
const TOTAL=1024,PER=16,PAGES=64;let page=0, data=JSON.parse(localStorage.getItem('dexfolio-v2')||'{}'), names=[];
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-NO',{style:'currency',currency:'NOK',maximumFractionDigits:0}).format(n||0);
function save(){localStorage.setItem('dexfolio-v2',JSON.stringify(data));renderStats()}
function renderStats(){let owned=0,total=0;for(let i=1;i<=TOTAL;i++){let x=data[i];if(x?.owned){owned++;total+=Number(x.price)||0}}$('ownedCount').textContent=owned;$('total').textContent=money(total)}
async function loadNames(){try{let r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');let j=await r.json();names=j.results.map(x=>x.name)}catch(e){names=[]}render()}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let start=page*PER+1,items=[];for(let i=start;i<start+PER&&i<=TOTAL;i++){let n=names[i-1]||`Pokémon ${i}`,x=data[i]||{},owned=!!x.owned;if(q&&!n.includes(q)&&!String(i).includes(q))continue;if(f==='owned'&&!owned||f==='missing'&&owned)continue;items.push({i,n,x,owned})}
$('grid').innerHTML=items.map(({i,n,x,owned})=>`<div class="slot ${owned?'owned':''}"><span class="num">#${String(i).padStart(4,'0')}</span><img class="sprite" loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${i}.png" onerror="this.style.visibility='hidden'"><div class="name">${n.replace(/-/g,' ')}</div><label class="status"><input type="checkbox" data-own="${i}" ${owned?'checked':''}> Owned</label><input class="value" data-price="${i}" type="number" min="0" step="1" placeholder="Card value (NOK)" value="${x.price??''}"></div>`).join('');
$('pageNum').textContent=page+1;$('pagerLabel').textContent=`Page ${page+1} / ${PAGES}`;$('prev').disabled=page===0;$('next').disabled=page===PAGES-1;
document.querySelectorAll('[data-own]').forEach(el=>el.onchange=()=>{let i=el.dataset.own;data[i]={...(data[i]||{}),owned:el.checked};save();render()});
document.querySelectorAll('[data-price]').forEach(el=>el.onchange=()=>{let i=el.dataset.price;data[i]={...(data[i]||{}),price:el.value===''?null:Number(el.value)};save()});
}
$('prev').onclick=()=>{page=Math.max(0,page-1);render()};$('next').onclick=()=>{page=Math.min(PAGES-1,page+1);render()};
$('search').oninput=()=>{page=0;render()};$('filter').onchange=()=>{page=0;render()};
$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='dexfolio-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());save();render()}catch{alert('Invalid backup file')}};
renderStats();loadNames();
</script></body></html>
